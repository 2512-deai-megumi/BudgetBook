<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout_login :: layout(~{::section})}">
	<link
	      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	      rel="stylesheet">
<head>
<meta charset="UTF-8">
<title>会員登録</title>
</head>
<section class="d-flex align-items-center justify-content-center" style="height: 100vh;">
<div class="card shadow-sm mb-4" style="width: 500px;">
	<div class="card-body p-4">
	<h2 class="text-center mb-4">会員登録</h2>
	
	<form th:action="@{/register}" th:object="${registerForm}" method="post">
		<div class="mb-3">
			<label class="form-label">名前</label>
			<input type="text" th:field="*{username}" class="form-control">
			<div class="text-danger small" th:errors="*{username}"></div>
		</div>
		<div class="mb-3">
			<label class="form-label">メール</label>
			<input type="email" th:field="*{email}" class="form-control">
			<div class="text-danger small" th:errors="*{email}"></div>
		</div>

		<div class="mb-4">
			<label class="form-label">パスワード</label>
			<input type="password" th:field="*{password}" class="form-control">
			<div class="text-danger small" th:errors="*{password}"></div>
		</div>
		<div class="text-center">
			<button type="submit" class="btn btn-success">登録</button>
		</div>
		
	</form>
	</div>
	</div>

</section>
</html>
