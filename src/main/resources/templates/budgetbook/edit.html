<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section}, true)}">
	<link
	      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	      rel="stylesheet">
<head>
  <meta charset="UTF-8">
  <title>家計簿編集</title>
</head>
<section>

	
<div class="mb-4">
	<h1>家計簿編集</h1>
</div>

<div class="card shadow-sm mb-4">
<div class="cardbody p-4 mb-4">
<form th:action="@{/budgetbook/edit/{id}(id=${budgetbook.id})}" th:object="${budgetbook}" method="post">
	<div>
		<label>日付</label>
		<input type="date" name="date" th:value="*{date}" class="form-control">
	</div>
	
	<div>
		<label class="form-label">収支</label>
		<select th:field="*{type}" class="form-select" id = "typeSelect">
			<option value="">選択してください</option>
			<option value="収入">収入</option>
			<option value="支出">支出</option>
		</select>
		<div class="text-danger small" th:errors="*{type}"></div>
	</div>
	<div>
		<label>カテゴリ</label>
		<select th:field="*{category}" 
		class="form-select" 
		id = "categorySelect"
		th:attr="data-selected=*{category}">
				<option value="">選択してください</option>
		</select>
		<div class="text-danger small" th:errors="*{category}"></div>
	</div>
	<div>
		<label>金額</label>
		<input type="number" th:field="*{amount}" min="1" class="form-control">
		<div class="text-danger small" th:errors="*{amount}"></div>
	</div>
	<button type="submit" class = "btn btn-success">登録</button>

</form>

<p><a th:href="@{/budgetbook}">一覧へ戻る</a></p>
</div>
</div>

<script th:src="@{/js/category.js}"></script>
</section>
</html>
