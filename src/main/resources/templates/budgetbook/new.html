<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section}, true)}">
	<link
	      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	      rel="stylesheet">
<head>
  <meta charset="UTF-8">
  <title>家計簿追加</title>
</head>
<section>
<h1>家計簿追加</h1>

<div class="card shadow-sm mb-4">
<div class="card-body p-4">
<form th:action="@{/budgetbook/new}" th:object="${budgetbook}" method="post">
	<div class="mb-4">
		<label class="form-label">日付</label>
		<input type="date" th:field="*{date}" class="form-control" id ="dateSelect">
		<div class="text-danger small" th:errors="*{date}"></div>
	</div>
	
	<div class="mb-4">
		<label class="form-label">収支</label>
		<select th:field="*{type}" class="form-select" id="typeSelect">
			<option value="">選択してください</option>
			<option value="収入">収入</option>
			<option value="支出">支出</option>
		</select>
		<div class="text-danger small" th:errors="*{type}"></div>
	</div>
	<div class="mb-4">
		<label class="form-label">カテゴリ</label>
		<select th:field="*{category}" class="form-select" id="categorySelect">
			<option value="">選択してください</option>
		</select>
		<div class="text-danger small" th:errors="*{category}"></div>
	</div>
	<div class="mb-4">
		<label class="form-label">金額</label>
		<input type="number" th:field="*{amount}" class="form-control">
		<div class="text-danger small" th:errors="*{amount}"></div>
	</div>
	<button type="submit" class="btn btn-success">登録</button>

</form>

<p><a th:href="@{/budgetbook}">一覧へ戻る</a></p>
</div>
</div>

<script th:src="@{/js/category.js}"></script>
<script th:src="@{/js/date.js}"></script>

</section>

</html>
